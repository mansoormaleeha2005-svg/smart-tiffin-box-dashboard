version: '3.8'

services:
  smart-tiffin-box:
    build: .
    container_name: smart-tiffin-box-dashboard
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - TZ=UTC
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smart-tiffin-network

  # Optional: Add a reverse proxy for SSL termination
  nginx-proxy:
    image: nginx:alpine
    container_name: smart-tiffin-proxy
    ports:
      - "443:443"
    volumes:
      - ./ssl-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - smart-tiffin-box
    restart: unless-stopped
    networks:
      - smart-tiffin-network

networks:
  smart-tiffin-network:
    driver: bridge

volumes:
  ssl:
    driver: local
